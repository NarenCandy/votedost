<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoteDost - Your Indian Election Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="icon">🗳️</span>
                <h1>VoteDost</h1>
            </div>
            <p class="tagline">Your friendly guide to Indian elections</p>
            
            <div class="suggested-chips">
                <button class="chip" onclick="sendSuggested('How do I register to vote?')">How do I register to vote?</button>
                <button class="chip" onclick="sendSuggested('What is EVM?')">What is EVM?</button>
                <button class="chip" onclick="sendSuggested('Who can contest elections?')">Who can contest elections?</button>
                <button class="chip" onclick="sendSuggested('What is Model Code of Conduct?')">What is Model Code of Conduct?</button>
            </div>
        </header>

        <main class="chat-container">
            <div id="chat-messages" class="messages-area">
                <div class="message bot-message">
                    <div class="avatar">🤖</div>
                    <div class="content">Namaste! I am VoteDost. How can I help you with the Indian elections today?</div>
                </div>
            </div>
            
            <div class="typing-indicator hidden" id="typing-indicator">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </main>

        <footer class="input-area">
            <form id="chat-form">
                <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off" required>
                <button type="submit" id="send-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="css-i6dzq1"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
